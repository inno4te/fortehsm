plugins {
    id 'com.android.application'
}

android {
    namespace 'com.team21.fortefam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.team21.fortefam'
        minSdk 26              // Android 8.0 — covers ~95% of phones in 2026; supports adaptive icons
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
        resourceConfigurations += ['en']
    }

    // One permanent ForTe Fam key, so every new APK installs as an UPDATE over the old one.
    // Supplied by environment variables (GitHub Actions secrets) — never committed to the repo.
    def ksPath = System.getenv("FF_KEYSTORE")
    def hasKey = ksPath != null && new File(ksPath).exists()
    signingConfigs {
        fortefam {
            if (hasKey) {
                storeFile file(ksPath)
                storePassword System.getenv("FF_KEYSTORE_PASS")
                keyAlias System.getenv("FF_KEY_ALIAS") ?: "fortefam"
                keyPassword System.getenv("FF_KEY_PASS") ?: System.getenv("FF_KEYSTORE_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.fortefam : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ''     // keep the same package id so updates replace cleanly
            if (hasKey) signingConfig signingConfigs.fortefam
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
